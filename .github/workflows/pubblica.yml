name: Pubblica sito e dati ARPAE

# Ogni 15 minuti scarica allerte e livelli dei fiumi da Allerta Meteo ER e ripubblica il sito con dati.json accanto.
# Il ritmo lo dà il Worker Cloudflare cieloromagna-sveglia (cron */15 → workflow_dispatch): niente schedule GitHub,
# che arrivavano ogni 2-4 ore e raddoppiavano i giri. Gira anche a ogni push su main, così le modifiche vanno online subito.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scarica allerte e livelli da ARPAE
        id: dati
        continue-on-error: true          # il sito va online lo stesso, con l'ultimo dato buono
        run: node scripts/dati.mjs
      - name: Avvisi Telegram (allerte nuove o più gravi, fiumi oltre soglia)
        if: hashFiles('dati.json') != ''
        continue-on-error: true          # se Telegram non risponde il sito si aggiorna lo stesso
        run: node scripts/avvisi.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r assets manifest.webmanifest sw.js _site/
          if [ -f dati.json ]; then cp dati.json _site/; fi
          node scripts/pagine.mjs _site      # home, pagine per località e per fiume, sitemap e robots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Subito dopo l'upload l'API di GitHub a volte non vede ancora l'artifact ("No artifacts named github-pages"):
      # si aspetta qualche secondo e, se il deploy fallisce lo stesso, si riprova una volta.
      - name: Attendi che l'artifact sia visibile
        run: sleep 10
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attendi prima di riprovare
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Segnala dati fermi
        if: steps.dati.outcome == 'failure'
        run: |
          echo "::error::I livelli ARPAE sono fermi da più di due ore (vedi il passo 'Scarica allerte e livelli')"
          exit 1
