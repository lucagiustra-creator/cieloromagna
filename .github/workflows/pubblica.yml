name: Pubblica sito e dati ARPAE

# Ogni 15 minuti (in teoria: le schedule di GitHub spesso arrivano ogni 2-4 ore) scarica allerte e livelli dei fiumi da Allerta Meteo ER e ripubblica il sito con dati.json accanto;
# gira anche a ogni push su main, così le modifiche alla pagina vanno online subito.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scarica allerte e livelli da ARPAE
        id: dati
        continue-on-error: true          # il sito va online lo stesso, con l'ultimo dato buono
        run: node scripts/dati.mjs
      - name: Avvisi Telegram (allerte nuove o più gravi, fiumi oltre soglia)
        if: hashFiles('dati.json') != ''
        continue-on-error: true          # se Telegram non risponde il sito si aggiorna lo stesso
        run: node scripts/avvisi.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r assets manifest.webmanifest sw.js _site/
          if [ -f dati.json ]; then cp dati.json _site/; fi
          node scripts/pagine.mjs _site      # home, pagine per località e per fiume, sitemap e robots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Segnala dati fermi
        if: steps.dati.outcome == 'failure'
        run: |
          echo "::error::I livelli ARPAE sono fermi da più di due ore (vedi il passo 'Scarica allerte e livelli')"
          exit 1
