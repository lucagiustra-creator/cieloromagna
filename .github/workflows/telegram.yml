name: Messaggio Telegram
run-name: Messaggio Telegram${{ github.event_name == 'workflow_dispatch' && format(' ({0})', inputs.modo) || '' }}

# Messaggio del mattino nel canale Telegram alle 7 italiane. Le schedule di GitHub arrivano in ritardo o saltano,
# quindi ce ne sono tante nella notte: la prima che parte aspetta le 7 (ora di Roma, legale o solare) e invia,
# le altre restano in coda e vedono che oggi è già partito. Quelle dopo le 7 sono la riserva, fino a mezzogiorno.
# A mano si può lanciare in modo "prova" o "mattina": parte subito, senza attese né controlli.
# Il token del bot sta nel secret TELEGRAM_BOT_TOKEN; il canale nella variabile TELEGRAM_CHAT (se manca lo trova lo script).
on:
  schedule:
    - cron: "13,43 1-5 * * *"
    - cron: "17 6-9 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "prova o mattina"
        default: prova

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Aspetta le 7
        id: ora
        if: github.event_name == 'schedule'
        run: |
          adesso=$(date +%s)
          sette=$(TZ=Europe/Rome date -d "today 07:00" +%s)
          mezzogiorno=$(TZ=Europe/Rome date -d "today 12:00" +%s)
          if [ "$adesso" -ge "$mezzogiorno" ]; then echo "è passato mezzogiorno, non invio"; echo "salta=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$adesso" -lt "$sette" ]; then echo "aspetto $(( (sette - adesso) / 60 )) minuti"; sleep $(( sette - adesso )); fi
      - name: Già inviato oggi?
        id: gia
        if: github.event_name == 'schedule' && steps.ora.outputs.salta != 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oggi=$(date -u +%F)
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w telegram.yml -L 40 --json databaseId,createdAt --jq ".[] | select(.createdAt | startswith(\"$oggi\")) | .databaseId"); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[].steps[] | select(.name == "Invia (mattina)" and .conclusion == "success") | .name' | grep -q .; then
              echo "oggi il messaggio è già partito (run $id), non invio"; echo "inviato=si" >> "$GITHUB_OUTPUT"; break
            fi
          done
      - uses: actions/checkout@v4
        if: steps.ora.outputs.salta != 'si' && steps.gia.outputs.inviato != 'si'
      - uses: actions/setup-node@v4
        if: steps.ora.outputs.salta != 'si' && steps.gia.outputs.inviato != 'si'
        with:
          node-version: 24
      - name: Invia (${{ github.event.inputs.modo || 'mattina' }})
        if: steps.ora.outputs.salta != 'si' && steps.gia.outputs.inviato != 'si'
        run: node scripts/telegram.mjs "${{ github.event.inputs.modo || 'mattina' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
