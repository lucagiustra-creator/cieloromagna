name: Messaggio Telegram

# Messaggio del mattino nel canale Telegram alle 7 italiane: gira alle 5 e alle 6 UTC e lo script invia solo
# da quella giusta per l'ora legale. A mano si può lanciare in modo "prova".
# Il token del bot sta nel secret TELEGRAM_BOT_TOKEN; il canale nella variabile TELEGRAM_CHAT (se manca lo trova lo script).
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "prova o mattina"
        default: prova

permissions:
  contents: read

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/telegram.mjs "${{ github.event.inputs.modo || 'mattina' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          SCHEDULE: ${{ github.event.schedule }}
