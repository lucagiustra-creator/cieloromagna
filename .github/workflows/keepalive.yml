name: Tieni attive le schedule

# GitHub sospende le schedule dei repo pubblici dopo 60 giorni senza attività:
# un commit al mese su .keepalive basta a tenerle vive.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keepalive mensile delle schedule"
          git push
